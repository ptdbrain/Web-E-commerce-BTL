<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - Tech-Geeks</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="checkout.css" />
</head>

<body>
    <header>
        <h1>Tech-Geeks</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="products.html">Sản phẩm</a>
            <a href="cart.html">Giỏ hàng</a>
        </nav>
    </header>

    <main class="checkout-container">
        <!-- Thông tin giao hàng -->
        <div class="checkout-form">
            <h2>Thông tin giao hàng</h2>

            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" placeholder="Nguyễn Văn A" />
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" placeholder="0912 345 678" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="example@email.com" />
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" placeholder="Số nhà, tên đường" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Tỉnh/Thành phố</label>
                    <select>
                        <option>Hà Nội</option>
                        <option>TP. Hồ Chí Minh</option>
                        <option>Đà Nẵng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quận/Huyện</label>
                    <input type="text" placeholder="Quận/Huyện" />
                </div>
            </div>

            <h2>Phương thức thanh toán</h2>
            <div class="payment-methods">
                <label class="payment-option">
                    <input type="radio" name="payment" value="cod" checked />
                    Thanh toán khi nhận hàng (COD)
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="banking" />
                    Chuyển khoản ngân hàng
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="vnpay" />
                    VNPay
                </label>
            </div>

            <button class="btn-order" onclick="placeOrder()">Đặt hàng</button>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="order-summary">
            <h2>Đơn hàng của bạn</h2>
            <div class="summary-item">
                <span>Laptop Dell XPS 15 x1</span>
                <span>25.990.000 đ</span>
            </div>
            <div class="summary-item">
                <span>Macbook Air M2 x1</span>
                <span>28.990.000 đ</span>
            </div>
            <hr />
            <div class="summary-item">
                <span>Tạm tính</span>
                <span>54.980.000 đ</span>
            </div>
            <div class="summary-item">
                <span>Phí vận chuyển</span>
                <span>Miễn phí</span>
            </div>
            <hr />
            <div class="summary-item total">
                <span>Tổng cộng</span>
                <span>54.980.000 đ</span>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Tech-Geeks</p>
    </footer>

    <script>
        function placeOrder() {
            window.location.href = "orders.html";
        }
    </script>
</body>

</html>
