<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng - Tech-Geeks</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="orders.css" />
</head>

<body>
    <header>
        <h1>Tech-Geeks</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="products.html">Sản phẩm</a>
            <a href="cart.html">Giỏ hàng</a>
        </nav>
    </header>

    <main class="orders-container">
        <h2>Đơn hàng của tôi</h2>

        <div class="order-card">
            <div class="order-header">
                <span class="order-id">#DH001</span>
                <span class="order-date">19/04/2024</span>
                <span class="order-status pending">Chờ xác nhận</span>
            </div>
            <div class="order-items">
                <p>Laptop Dell XPS 15 x1</p>
                <p>Macbook Air M2 x1</p>
            </div>
            <div class="order-footer">
                <span>Tổng: <strong>54.980.000 đ</strong></span>
                <button onclick="cancelOrder(this)">Hủy đơn</button>
            </div>
        </div>

        <div class="order-card">
            <div class="order-header">
                <span class="order-id">#DH002</span>
                <span class="order-date">10/04/2024</span>
                <span class="order-status delivered">Đã giao hàng</span>
            </div>
            <div class="order-items">
                <p>PC Gaming RTX 4060 x1</p>
            </div>
            <div class="order-footer">
                <span>Tổng: <strong>18.500.000 đ</strong></span>
                <button disabled>Đã hoàn thành</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Tech-Geeks</p>
    </footer>

    <script>
        function cancelOrder(btn) {
            const status = btn.closest(".order-card").querySelector(".order-status");
            status.textContent = "Đã hủy";
            status.className = "order-status cancelled";
            btn.disabled = true;
            btn.textContent = "Đã hủy";
        }
    </script>
</body>

</html>
